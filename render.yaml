services:
  - type: web
    name: wasl
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # سرّ توقيع مفاتيح المعلّمين — يولّده Render مرة واحدة ويبقى ثابتاً
      - key: WASL_SECRET
        generateValue: true
      # خوادم TURN من Cloudflare (اختياري، يحسّن الاتصال على شبكات الجوال): تُكتب قيمها من لوحة Render
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
      # مفتاح WaSender لإرسال تقرير الحضور بالواتساب للمعلّم (اختياري): تُكتب قيمته من لوحة Render
      - key: WASENDER_API_KEY
        sync: false
